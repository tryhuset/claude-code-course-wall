<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review · {{name}}</title>
<!--
  Local review page: the "pull request" for participants without GitHub.
  Claude copies this to participants/<name>/review.html and fills in every {{…}}.
  The screenshots are relative paths, so they load from screenshots/ next to this file.
-->
<style>
  :root { --bg: #f4f2ee; --fg: #161412; --muted: #6e6862; --line: #dcd5cc; --accent: #ff4f00; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 48px 24px 72px; }
  .eyebrow { margin: 0; font: 600 13px/1 ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  h1 { margin: 10px 0 24px; font-size: 36px; letter-spacing: -.02em; }
  h2 { margin: 32px 0 8px; font-size: 18px; }
  p { margin: 0; }
  .shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 12px; }
  figure { margin: 0; }
  img { display: block; width: 100%; max-width: 360px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  figcaption { margin-top: 6px; font: 13px/1.4 ui-monospace, monospace; color: var(--muted); }
  .meta { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Review · local, no GitHub</p>
  <h1>Card: {{name}}</h1>

  <h2>What I changed</h2>
  <p>{{what_changed}}</p>

  <h2>Screenshots</h2>
  <div class="shots">
    <figure><img src="screenshots/before.png" alt="Before"><figcaption>before</figcaption></figure>
    <figure><img src="screenshots/after.png" alt="After"><figcaption>after</figcaption></figure>
  </div>

  <h2>What Claude checked</h2>
  <p>{{what_claude_checked}}</p>

  <p class="meta">Branch <code>card/{{name}}</code> · taken with Agent Browser at 360 × 240</p>
</main>
</body>
</html>
